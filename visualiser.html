<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Voir mon tapis en 3D – Minirue</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🛣️%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/viewer.css">
<script>document.documentElement.classList.add('js')</script>
</head>
<body data-page="viewer">

<div id="site-header"></div>

<main class="viewer">
  <div class="stage" id="stage">
    <canvas id="gl" aria-label="Tapis de jeu en 3D, faites glisser pour tourner"></canvas>

    <div class="loader" id="loader">
      <div class="loader-road"><i></i></div>
      <p id="loaderTxt">Préparation de votre tapis</p>
    </div>
    <div class="nogl" id="nogl" hidden>
      <p>Votre navigateur n'a pas pu afficher la 3D.</p>
      <img id="fallbackImg" alt="Aperçu du tapis">
    </div>

    <div class="info" id="info">
      <b id="infoSize"></b>
      <span id="infoMat"></span>
    </div>
    <div class="hint" id="hint">Glissez pour tourner. Molette ou pincement pour zoomer.</div>

    <div class="toolbar" id="toolbar">
      <div class="group" role="group" aria-label="Point de vue">
        <button type="button" data-view="persp" class="on">Perspective</button>
        <button type="button" data-view="top">Vue du dessus</button>
        <button type="button" data-view="child">Vue enfant</button>
      </div>
      <div class="group" role="group" aria-label="Taille">
        <button type="button" data-size="a">120×80</button>
        <button type="button" data-size="b">150×100</button>
        <button type="button" data-size="c">180×120</button>
      </div>
      <div class="group" role="group" aria-label="Options">
        <button type="button" id="tgAuto" class="tog on" aria-pressed="true">Rotation</button>
        <button type="button" id="tgCars" class="tog on" aria-pressed="true">Voitures</button>
      </div>
      <a class="btn btn-primary btn-sm" id="buy" href="paiement.html">Commander</a>
    </div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="js/common.js"></script>
<script src="js/sample.js"></script>
<script src="js/matgen.js"></script>
<script src="js/viewer3d.js"></script>
</body>
</html>
